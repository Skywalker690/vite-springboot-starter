spring.application.name=backend

# Load variables from backend/.env if it exists (see .env.example).
# Real environment variables always take precedence.
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

# Comma-separated list of origins allowed to call /api/** (the Vite dev server by default)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Database -----------------------------------------------------------------
# Defaults to an in-memory H2 database so the app runs with zero setup.
# Point DB_URL at MySQL to use a real database, e.g.
#   DB_URL=jdbc:mysql://localhost:3306/app?createDatabaseIfNotExist=true
# The driver and Hibernate dialect are detected from the URL.
spring.datasource.url=${DB_URL:jdbc:h2:mem:app;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# --- API errors ---------------------------------------------------------------
# Return RFC 9457 "application/problem+json" bodies for errors
spring.mvc.problemdetails.enabled=true

# --- Actuator -----------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
